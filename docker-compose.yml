services:
  mysql:
    image: mysql:8
    container_name: hospital-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-psasa1234" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hospital-mysql-data:/var/lib/mysql

  app:
    build: .
    image: hospital-app
    container_name: hospital-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hospital_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    profiles:
      - dev
volumes:
  hospital-mysql-data: